
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DLZ7 - Week 42</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
    cursor: none;
  }
  body.show-cursor { cursor: default; }

  #slideshow {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  #slideshow img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    transition: opacity 0.5s ease-in-out;
  }

  #controls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.7);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 12px;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 10;
  }
  body.show-cursor #controls { opacity: 1; }

  #controls button {
    background: none;
    border: 2px solid #fff;
    color: #fff;
    font-size: 18px;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #controls button:hover { background: rgba(255,255,255,0.2); }
  #controls button.active { background: rgba(255,255,255,0.3); }

  #counter {
    font-size: 16px;
    min-width: 80px;
    text-align: center;
  }

  #progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 4px;
    background: #4CAF50;
    transition: width 0.3s;
    z-index: 10;
  }

  .nav-area {
    position: fixed;
    top: 0;
    width: 15%;
    height: 100%;
    z-index: 5;
    cursor: pointer;
  }
  .nav-area.left { left: 0; }
  .nav-area.right { right: 0; }
</style>
</head>
<body>

<div id="progress-bar"></div>

<div id="slideshow">
  <img id="slide" src="" alt="Slide">
</div>

<div class="nav-area left" onclick="prevSlide()"></div>
<div class="nav-area right" onclick="nextSlide()"></div>

<div id="controls">
  <button onclick="prevSlide()">◀ Indietro</button>
  <span id="counter">1 / 11</span>
  <button onclick="nextSlide()">Avanti ▶</button>
  <button id="autoplayBtn" onclick="toggleAutoplay()">⏸ Auto</button>
  <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
</div>

<script>
  // ============================================================
  // IMMAGINI PRESENTAZIONE DLZ7 - WEEK 42
  // Nomi file senza spazi, punti o parentesi
  // ============================================================
  const slides = [
    '01_SUM.PNG',
    '02_Team.PNG',
    '03_Injury.png',
    '04_Birthday.png',
    '05_AtoZ1.JPG',
    '06_AtoZ2.JPG',
    '07_AtoZ.JPG',
    '08_ERC.JPG',
    '09_MyHR.JPG',
    '10_MyHR_Accesso.JPG',
    '11_Sickness.png',
  ];

  let current = 0;
  let autoplay = true; // AUTOPLAY ATTIVO ALL'AVVIO
  let autoplayInterval = null;
  let cursorTimeout = null;

  const slideImg = document.getElementById('slide');
  const counter = document.getElementById('counter');
  const progressBar = document.getElementById('progress-bar');
  const autoplayBtn = document.getElementById('autoplayBtn');

  function showSlide(index) {
    if (slides.length === 0) return;
    current = (index + slides.length) % slides.length;
    slideImg.src = slides[current];
    counter.textContent = (current + 1) + ' / ' + slides.length;
    progressBar.style.width = ((current + 1) / slides.length * 100) + '%';
  }

  function nextSlide() { showSlide(current + 1); }
  function prevSlide() { showSlide(current - 1); }

  function toggleAutoplay() {
    autoplay = !autoplay;
    autoplayBtn.classList.toggle('active', autoplay);
    autoplayBtn.textContent = autoplay ? '⏸ Auto' : '▶ Auto';
    if (autoplay) {
      autoplayInterval = setInterval(nextSlide, 5000);
    } else {
      clearInterval(autoplayInterval);
    }
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    if (e.key === 'Home') { e.preventDefault(); showSlide(0); }
    if (e.key === 'End') { e.preventDefault(); showSlide(slides.length - 1); }
    if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
    if (e.key === 'a' || e.key === 'A') { toggleAutoplay(); }
  });

  document.addEventListener('mousemove', () => {
    document.body.classList.add('show-cursor');
    clearTimeout(cursorTimeout);
    cursorTimeout = setTimeout(() => {
      document.body.classList.remove('show-cursor');
    }, 3000);
  });

  // AVVIO: mostra prima slide e parte autoplay
  showSlide(0);
  autoplayInterval = setInterval(nextSlide, 5000);
</script>

</body>
</html>
